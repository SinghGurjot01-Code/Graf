name: Build Graf for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: graf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Graf Desktop source
        id: source
        shell: pwsh
        run: |
          $ProjectDir = $null

          if (Test-Path "package.json") {
            $ProjectDir = "."
          } elseif (Test-Path "graf-desktop/package.json") {
            $ProjectDir = "graf-desktop"
          } else {
            $ZipCandidates = @(
              "Graf-Desktop-v1.0.1-source.zip",
              "Graf-Desktop-v1.0.0-source.zip",
              "graf-desktop-source.zip"
            )
            $ZipFile = $ZipCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

            if ($ZipFile) {
              Expand-Archive -Path $ZipFile -DestinationPath "."
              if (Test-Path "graf-desktop/package.json") {
                $ProjectDir = "graf-desktop"
              } elseif (Test-Path "package.json") {
                $ProjectDir = "."
              }
            }
          }

          if (-not $ProjectDir) {
            "source_present=false" >> $env:GITHUB_OUTPUT
            "## Graf Desktop build skipped" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "The repository does not contain Graf Desktop source." >> $env:GITHUB_STEP_SUMMARY
            Write-Host "::notice::No Graf Desktop source found. Build steps were skipped."
          } else {
            "source_present=true" >> $env:GITHUB_OUTPUT
            "project_dir=$ProjectDir" >> $env:GITHUB_OUTPUT
            Write-Host "Graf Desktop source found at: $ProjectDir"
          }

      - name: Set up Node.js
        if: steps.source.outputs.source_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.source.outputs.source_present == 'true'
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run syntax checks
        if: steps.source.outputs.source_present == 'true'
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm run check

      - name: Run tests (serial, Windows-safe)
        if: steps.source.outputs.source_present == 'true'
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm test -- --test-concurrency=1

      - name: Build Windows x64 installer
        if: steps.source.outputs.source_present == 'true'
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm run build:win

      - name: Upload installer artifact
        if: steps.source.outputs.source_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Graf-Windows-x64
          path: ${{ steps.source.outputs.project_dir }}/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: steps.source.outputs.source_present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.source.outputs.project_dir }}/release/*.exe
          generate_release_notes: true
